name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          find . -type f \( -name '*.sh' -path './hooks/*' \
            -o -name '*.sh' -path './scripts/*' \
            -o -name 'hydrate.sh' \
            -o -path './.githooks/pre-commit' \
            -o -path './tools/aws-secret-field' \
            -o -path './tools/md2clip' \) \
            -exec shellcheck --severity=warning {} +
